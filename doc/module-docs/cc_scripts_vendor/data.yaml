cc_scripts_vendor:
  description: |
    On select Datasources, vendors have a channel for the consumption of all
    supported user data types via a special channel called vendor data.
    Scripts from vendor data are written to the instance's ``scripts/vendor``
    directory (by default ``/var/lib/cloud/instance/scripts/vendor/``). This
    module runs the executable files in that directory, in alphabetical
    order, once per instance. ``vendor_data.prefix`` is prepended to the
    command used to run each file.

    To stop vendor data scripts from being written, set
    ``vendor_data.enabled`` to ``false``. The second vendor data source
    writes to the same directory and is controlled separately by
    ``vendor_data2.enabled``.
  examples:
  - comment: |
      Example 1:
    file: cc_scripts_vendor/example1.yaml
  - comment: |
      Example 2:
    file: cc_scripts_vendor/example2.yaml
  - comment: |
      Example 3: Vendor data will not be processed.
    file: cc_scripts_vendor/example3.yaml
  name: Scripts Vendor
  title: Run vendor scripts
