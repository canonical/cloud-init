cc_disable_ec2_metadata:
  description: |
    This module can disable the EC2 datasource by rejecting the route to
    ``169.254.169.254``, the usual route to the datasource. When the ``ip``
    command is used and the kernel supports IPv6, it also rejects the route
    to ``fd00:ec2::254``, the IPv6 address of the datasource. This module is
    disabled by default.
  examples:
  - comment: |
      Example 1:
    file: cc_disable_ec2_metadata/example1.yaml
  name: Disable EC2 Instance Metadata Service
  title: Disable AWS EC2 Instance Metadata Service
